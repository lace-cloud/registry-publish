name: Lace Registry Publish
description: Publish the Lace registry modules, scanners, handlers and agents a push changed.

branding:
  icon: upload-cloud
  color: blue

inputs:
  token:
    description: >-
      A Lace service token that may publish into the Lace Registry. Mint it
      in the Lace portal and pass it from a repository secret.
    required: true
  api-url:
    description: The Lace API the artifacts are published to.
    required: false
    default: https://lace.cloud
  lace-version:
    description: >-
      The lace CLI release to publish with, as vX.Y.Z. Empty uses the
      release this version of the action was published with.
    required: false
    default: ''
  path:
    description: >-
      One manifest directory to publish, instead of the directories the push
      changed. For a workflow_dispatch run that republishes it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        LACE_TOKEN: ${{ inputs.token }}
        LACE_AUTH_URL: ${{ inputs.api-url }}
        LACE_VERSION: ${{ inputs.lace-version }}
        INPUT_PATH: ${{ inputs.path }}
        EVENT_NAME: ${{ github.event_name }}
        CREATED: ${{ github.event.created }}
        BEFORE: ${{ github.event.before }}
      run: "${GITHUB_ACTION_PATH}/publish.sh"
